services:
  ss14_watchdog:
    image: ghcr.io/khaomi/ss14.watchdog:latest
    container_name: ss14_watchdog
    volumes:
      - ./appsettings.yml:/app/appsettings.yml
      - ./instances:/app/instances
      - ./data.db:/app/data.db
    ports:
      # SECURE THIS PORT!
      # either change to 127.0.0.1:5000:5000 to only allow local access, or use a reverse proxy to secure it.
      - 5000:5000
      - 1212:1212/tcp
      - 1212:1212/udp
    restart: unless-stopped
